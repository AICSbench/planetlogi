name: Deploy API to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to main)"
        required: false
        default: "main"

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-api-vps:
    name: Deploy Go API & Workers to VPS
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Deploy via SSH + Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            TARGET_REF="${{ inputs.ref || 'main' }}"
            cd /opt/planetlogi
            git fetch origin "$TARGET_REF"
            git reset --hard FETCH_HEAD
            docker compose --env-file .env.prod -f docker/docker-compose.prod.yml up -d --build api worker
            docker compose --env-file .env.prod -f docker/docker-compose.prod.yml run --rm seed
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:18080/readyz >/dev/null; then
                echo "API readyz OK"
                exit 0
              fi
              sleep 2
            done
            echo "API readyz check failed" >&2
            exit 1
