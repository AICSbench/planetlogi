name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-api:
    name: Go API & Workers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planetlogi
          POSTGRES_PASSWORD: planetlogi_ci
          POSTGRES_DB: planetlogi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planetlogi -d planetlogi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Go Vet
        run: go vet ./...
      - name: Migrate and seed test database
        env:
          DATABASE_URL: postgres://planetlogi:planetlogi_ci@localhost:5432/planetlogi_test?sslmode=disable
        run: go run ./cmd/seed
      - name: Go Test (Race)
        env:
          TEST_DATABASE_URL: postgres://planetlogi:planetlogi_ci@localhost:5432/planetlogi_test?sslmode=disable
        run: go test -race ./...
      - name: Build Binaries
        run: |
          go build ./cmd/server
          go build ./cmd/worker
          go build ./cmd/seed
          go build ./cmd/openapi

  web-packages:
    name: Web PWA & TS Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check i18n Key Parity (en & id)
        run: pnpm i18n:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit Tests
        run: pnpm test
      - name: Build Static Cloudflare Pages Bundle
        run: pnpm build
