services:
  postgres:
    image: postgres:19-alpine
    container_name: planetlogi-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planetlogi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-planetlogi}
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planetlogi} -d ${POSTGRES_DB:-planetlogi}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: planetlogi-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        CMD_TARGET: server
    container_name: planetlogi-api-prod
    restart: unless-stopped
    env_file:
      - ../.env.prod
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        CMD_TARGET: worker
    container_name: planetlogi-worker-prod
    restart: unless-stopped
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        CMD_TARGET: seed
    profiles: ["tools"]
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
