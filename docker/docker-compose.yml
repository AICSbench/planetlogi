services:
  postgres:
    image: postgres:16-alpine
    container_name: planetlogi-postgres
    environment:
      POSTGRES_USER: planetlogi
      POSTGRES_PASSWORD: planetlogi_dev
      POSTGRES_DB: planetlogi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planetlogi -d planetlogi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: planetlogi-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: planetlogi-minio
    environment:
      MINIO_ROOT_USER: planetlogi_minio
      MINIO_ROOT_PASSWORD: planetlogi_minio_dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set local http://minio:9000 planetlogi_minio planetlogi_minio_dev;
      /usr/bin/mc mb --ignore-existing local/planetlogi-assets;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
